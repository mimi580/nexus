name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --junitxml=junit.xml
      - name: Report test results
        if: always()
        run: python scripts/ci_annotate.py junit.xml
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrations.sqlite3
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrations.sqlite3
        run: alembic check
      - name: Simulation smoke test
        run: python -m app.cli simulate --days 10 > simulation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-report
          path: simulation-report.json

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py >> .env
          echo "NEXUS_DOMAIN=localhost" >> .env
      - name: Compose file is valid
        run: docker compose config -q
      - name: Build images
        run: docker compose build api
      - name: Start database, migrate (PostgreSQL), start API
        run: docker compose up -d db migrate api
      - name: API becomes healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs api migrate
          exit 1
      - name: Dashboard requires the login
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/state)" = "401"
          user=$(grep '^DASHBOARD_USERNAME=' .env | tail -1 | cut -d= -f2)
          pass=$(grep '^DASHBOARD_PASSWORD=' .env | tail -1 | cut -d= -f2)
          curl -fsS -u "$user:$pass" http://127.0.0.1:8000/api/state > /dev/null
      - name: Doctor and one worker cycle against PostgreSQL
        run: |
          docker compose exec -T api python -m app.cli doctor
          docker compose run --rm worker python scripts/worker.py --once
          docker compose run --rm worker python scripts/worker.py --check-heartbeat || true
      - name: Migration downgrade and upgrade on PostgreSQL
        run: |
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
