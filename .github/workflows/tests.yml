name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --junitxml=junit.xml
      - name: Report test failures
        if: failure()
        run: python scripts/ci_annotate.py junit.xml
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrations.sqlite3
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migrations.sqlite3
        run: alembic check
      - name: Simulation smoke test
        run: python -m app.cli simulate --days 10 > simulation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-report
          path: simulation-report.json
